<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BF6 Session Overlay</title>
<script src="config.js"></script>
<script src="bf6-session.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{background:transparent;width:380px;font-family:'Barlow Condensed',sans-serif;-webkit-font-smoothing:antialiased}

  .card{width:380px;background:rgba(0,0,0,0.85);border-radius:12px;border-left:3px solid #ffdd2a;overflow:hidden;backdrop-filter:blur(8px);box-shadow:0 4px 32px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.04);position:relative}
  .card::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.06) 2px,rgba(0,0,0,.06) 4px);pointer-events:none;border-radius:12px;z-index:1}
  .card-inner{position:relative;z-index:2;padding:14px 16px 12px}

  .header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .player-name{font-size:17px;font-weight:900;color:#fff;letter-spacing:.04em;text-transform:uppercase;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .perf-badge{font-size:10px;font-weight:800;letter-spacing:.1em;padding:3px 10px;border-radius:20px;text-transform:uppercase;white-space:nowrap;flex-shrink:0;transition:all .5s ease}
  .perf-badge.hot{background:rgba(255,100,30,.2);border:1px solid rgba(255,100,30,.5);color:#ff6b2b}
  .perf-badge.avg{background:rgba(255,221,42,.15);border:1px solid rgba(255,221,42,.4);color:#ffdd2a}
  .perf-badge.cold{background:rgba(100,160,255,.15);border:1px solid rgba(100,160,255,.4);color:#6db3ff}

  .divider{height:1px;background:linear-gradient(90deg,#ffdd2a 0%,rgba(255,221,42,.15) 60%,transparent 100%);margin-bottom:10px}

  .center-stats{display:flex;gap:0;margin-bottom:12px}
  .stat-main{flex:1;display:flex;flex-direction:column;gap:2px}
  .stat-main+.stat-main{border-left:1px solid rgba(255,255,255,.07);padding-left:20px}
  .stat-main:first-child{padding-right:20px}
  .stat-label-main{font-size:9px;font-weight:700;letter-spacing:.16em;color:rgba(255,255,255,.3);text-transform:uppercase}
  .stat-value-main{font-family:'Share Tech Mono',monospace;font-size:50px;line-height:1;letter-spacing:-.02em}
  .stat-value-main.kills{color:#ffdd2a}
  .stat-value-main.kd{color:#fff}

  .bottom-row{display:flex;justify-content:space-between;background:rgba(255,255,255,.03);border-radius:6px;padding:7px 12px;margin-bottom:10px;border:1px solid rgba(255,255,255,.05)}
  .stat-minor{display:flex;flex-direction:column;align-items:center;gap:3px}
  .stat-minor-label{font-size:9px;font-weight:700;letter-spacing:.12em;color:rgba(255,255,255,.28);text-transform:uppercase}
  .stat-minor-value{font-family:'Share Tech Mono',monospace;font-size:14px;color:#fff;letter-spacing:.02em}

  .tiles-label{font-size:8px;font-weight:800;letter-spacing:.2em;color:rgba(255,255,255,.18);text-transform:uppercase;margin-bottom:5px}
  .match-tiles{display:flex;gap:4px;margin-bottom:10px}
  .tile{flex:1;border-radius:5px;padding:5px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:all .3s ease}
  .tile.win{background:rgba(80,220,100,.1);border:1px solid rgba(80,220,100,.3)}
  .tile.loss{background:rgba(255,70,70,.08);border:1px solid rgba(255,70,70,.25)}
  .tile.empty{background:rgba(255,255,255,.03);border:1px dashed rgba(255,255,255,.07)}
  .tile-result{font-size:9px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}
  .tile.win .tile-result{color:#50dc64}
  .tile.loss .tile-result{color:#ff6060}
  .tile.empty .tile-result{color:rgba(255,255,255,.12)}
  .tile-kd{font-family:'Share Tech Mono',monospace;font-size:10px;color:rgba(255,255,255,.55)}
  .tile.empty .tile-kd{color:rgba(255,255,255,.1)}

  .footer{display:flex;justify-content:space-between;align-items:center}
  .footer-brand{font-size:9px;font-weight:700;letter-spacing:.15em;color:rgba(255,221,42,.35);text-transform:uppercase}
  .footer-time{font-family:'Share Tech Mono',monospace;font-size:9px;color:rgba(255,255,255,.2);letter-spacing:.05em}

  .loading{display:flex;align-items:center;gap:8px;justify-content:center;min-height:160px}
  .loading-dot{width:6px;height:6px;border-radius:50%;background:#ffdd2a;animation:pulse 1.2s ease-in-out infinite}
  .loading-dot:nth-child(2){animation-delay:.2s}
  .loading-dot:nth-child(3){animation-delay:.4s}
  @keyframes pulse{0%,80%,100%{opacity:.15;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}

  .error-msg{font-size:11px;color:rgba(255,80,80,.7);text-align:center;min-height:160px;display:flex;align-items:center;justify-content:center;letter-spacing:.05em;line-height:1.6}
  .error-msg .err-sub{font-size:9px;opacity:.5;letter-spacing:.08em;display:block;margin-top:3px}

  .match-flash{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .4s ease}
  .match-flash.show{opacity:1;pointer-events:auto}
  .match-flash.win-flash{background:rgba(0,0,0,.93);border-left:3px solid #50dc64}
  .match-flash.loss-flash{background:rgba(0,0,0,.93);border-left:3px solid #ff6060}
  .flash-label{font-size:10px;font-weight:800;letter-spacing:.3em;text-transform:uppercase;margin-bottom:6px;opacity:.5}
  .flash-label.win{color:#50dc64}
  .flash-label.loss{color:#ff6060}
  .flash-result{font-size:72px;font-weight:900;letter-spacing:.02em;text-transform:uppercase;line-height:1;margin-bottom:10px}
  .flash-result.win{color:#50dc64}
  .flash-result.loss{color:#ff6060}
  .flash-kd{font-family:'Share Tech Mono',monospace;font-size:24px;color:rgba(255,255,255,.85);letter-spacing:.04em;margin-bottom:4px}
  .flash-sub{font-size:9px;font-weight:700;letter-spacing:.2em;color:rgba(255,255,255,.25);text-transform:uppercase}
  .flash-bar{position:absolute;bottom:0;left:0;height:3px;background:#ffdd2a;animation:flash-progress 8s linear forwards}
  @keyframes flash-progress{from{width:100%}to{width:0%}}
  @keyframes flash-border{0%{border-left-color:#ffdd2a}50%{border-left-color:rgba(255,221,42,.3)}100%{border-left-color:#ffdd2a}}
  .card.refreshing{animation:flash-border .5s ease}

  /* streak badge */
  .streak-badge{
    position:absolute;top:10px;right:10px;z-index:20;
    font-size:10px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;
    padding:4px 12px;border-radius:20px;pointer-events:none;
    opacity:0;transform:translateY(-6px);
    transition:opacity .3s ease, transform .3s ease;
  }
  .streak-badge.show{opacity:1;transform:translateY(0)}
  .streak-badge.fire  {background:rgba(255,100,30,.22);border:1px solid rgba(255,100,30,.55);color:#ff6b2b}
  .streak-badge.streak{background:rgba(255,221,42,.15);border:1px solid rgba(255,221,42,.45);color:#ffdd2a}
  .streak-badge.clutch{background:rgba(80,220,100,.15);border:1px solid rgba(80,220,100,.45);color:#50dc64}
  .streak-badge.tilt  {background:rgba(100,160,255,.15);border:1px solid rgba(100,160,255,.45);color:#6db3ff}
</style>
</head>
<body>
<div class="card" id="card">
  <div id="streakBadge" class="streak-badge"></div>
  <div class="card-inner" id="content">
    <div class="loading"><div class="loading-dot"></div><div class="loading-dot"></div><div class="loading-dot"></div></div>
  </div>
  <div class="match-flash" id="matchFlash"></div>
</div>
<script>
const p        = new URLSearchParams(location.search);
const PLAYER   = p.get('name')     || 'katat0nia';
const PLATFORM = p.get('platform') || 'ea';

let flashTimer = null, streakTimer = null;

const session = new BF6Session({
  player:     PLAYER,
  platform:   PLATFORM,
  storageKey: `bf6_session_${PLAYER}_${PLATFORM}`,
  historyKey: `bf6_history_${PLAYER}_${PLATFORM}`,
});

function showStreakFlash(type) {
  const el = document.getElementById('streakBadge');
  if (!el) return;
  if (streakTimer) clearTimeout(streakTimer);
  el.textContent = BF6Session.STREAK_LABELS[type];
  el.className = `streak-badge ${type} show`;
  streakTimer = setTimeout(() => el.classList.remove('show'), 5000);
}

function showMatchFlash(isWin, matchKills, matchDeaths) {
  const el = document.getElementById('matchFlash');
  if (flashTimer) clearTimeout(flashTimer);
  const kd = matchDeaths > 0 ? (matchKills / matchDeaths).toFixed(2) : matchKills > 0 ? '∞' : '—';
  el.className = `match-flash show ${isWin ? 'win' : 'loss'}-flash`;
  el.innerHTML = `
    <span class="flash-label ${isWin ? 'win' : 'loss'}">MATCH RESULT</span>
    <span class="flash-result ${isWin ? 'win' : 'loss'}">${isWin ? 'WIN' : 'LOSS'}</span>
    <span class="flash-kd">${matchKills} / ${matchDeaths}</span>
    <span class="flash-sub">${kd} K/D THIS ROUND</span>
    <div class="flash-bar"></div>`;
  flashTimer = setTimeout(() => { el.classList.remove('show'); }, 8000);
}

function renderError(type) {
  const line1 = type === 'not_found' ? `Player "${PLAYER}" not found` : type === 'timeout' ? 'API not responding' : 'Stats unavailable';
  const sub   = type === 'not_found' ? 'Check name and platform in the URL' : 'Retrying in 60s';
  document.getElementById('content').innerHTML = `<div class="error-msg"><div><div style="font-size:20px;margin-bottom:5px;opacity:.4">${type === 'not_found' ? '⚠' : '↻'}</div><div>${line1}</div><span class="err-sub">${sub}</span></div></div>`;
}

function markStale() {
  const ft = document.getElementById('footerTime');
  if (ft) { ft.textContent = '⚠ stale'; ft.style.color = 'rgba(255,180,0,.65)'; }
}

function renderSession({ baseline: bl, deltas: d, tier, displayName, history }) {
  const { kills, deaths, wins, losses, seconds, kdNum } = d;
  const kd      = deaths > 0 ? BF6Session.fmt(kdNum, 2) : kills > 0 ? '∞' : '—';
  const startHH = new Date(bl.startedAt).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
  const tilesHTML = Array(5).fill(null).map((_, i) => {
    const t = history[i] || null;
    return t
      ? `<div class="tile ${t.win ? 'win' : 'loss'}"><span class="tile-result">${t.win ? 'W' : 'L'}</span><span class="tile-kd">${t.kills}/${t.deaths}</span></div>`
      : `<div class="tile empty"><span class="tile-result">·</span><span class="tile-kd">—</span></div>`;
  }).join('');

  document.getElementById('content').innerHTML = `
    <div class="header">
      <span class="player-name">${displayName}</span>
      <span class="perf-badge ${tier}">${BF6Session.PERF_LABEL[tier]}</span>
    </div>
    <div class="divider"></div>
    <div class="center-stats">
      <div class="stat-main">
        <span class="stat-label-main">Session Kills</span>
        <span class="stat-value-main kills">+${BF6Session.fmt(kills)}</span>
      </div>
      <div class="stat-main">
        <span class="stat-label-main">Session K/D</span>
        <span class="stat-value-main kd">${kd}</span>
      </div>
    </div>
    <div class="bottom-row">
      <div class="stat-minor"><span class="stat-minor-label">Deaths</span><span class="stat-minor-value">${BF6Session.fmt(deaths)}</span></div>
      <div class="stat-minor"><span class="stat-minor-label">W / L</span><span class="stat-minor-value">${wins} / ${losses}</span></div>
      <div class="stat-minor"><span class="stat-minor-label">Matches</span><span class="stat-minor-value">${BF6Session.fmt(d.matches)}</span></div>
      <div class="stat-minor"><span class="stat-minor-label">Time</span><span class="stat-minor-value">${BF6Session.fmtSecs(seconds)}</span></div>
    </div>
    <div class="tiles-label">LAST MATCHES</div>
    <div class="match-tiles">${tilesHTML}</div>
    <div class="footer">
      <span class="footer-brand">CORILLO.LIVE · BF6</span>
      <span class="footer-time" id="footerTime">since ${startHH}</span>
    </div>`;
}

session.addEventListener('data', ({ detail }) => {
  if (detail.isRefresh) {
    const card = document.getElementById('card');
    card.classList.add('refreshing');
    setTimeout(() => card.classList.remove('refreshing'), 500);
  }
  renderSession(detail);
});
session.addEventListener('match', ({ detail: { win, matchKills, matchDeaths } }) => {
  showMatchFlash(win, matchKills, matchDeaths);
});
session.addEventListener('streak', ({ detail: { type } }) => {
  if (document.getElementById('matchFlash')?.classList.contains('show')) return;
  showStreakFlash(type);
});
session.addEventListener('error', ({ detail: { type } }) => {
  renderError(type);
});
session.addEventListener('stale', () => {
  markStale();
});

session.start();
</script>
</body>
</html>
