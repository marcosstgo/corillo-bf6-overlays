<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>WARDOGS · Tarjeta de Steam — CORILLO</title>
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:transparent;width:380px;font-family:'Barlow Condensed',sans-serif}
.card{width:380px}
.header{display:flex;align-items:center;gap:10px;margin-bottom:2px}
.ava{width:34px;height:34px;flex:none;background:#173383 center/cover;clip-path:polygon(0 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%)}
.player-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subheader{display:flex;justify-content:space-between;margin-bottom:8px}
.row{display:flex;align-items:flex-end;gap:12px}
.big{font-size:56px !important;line-height:.9}
.unit{font-size:20px;font-weight:800;color:#a4b6e6;letter-spacing:.06em;padding-bottom:6px}
.bar{height:6px;background:rgba(255,255,255,.12);margin-top:9px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ff6a3d,#ffd23f);box-shadow:0 0 12px rgba(255,106,61,.6)}
.xp{margin-top:5px;font-size:13px;font-weight:700;color:#a4b6e6;letter-spacing:.03em}
.xp b{color:#ffd23f}
.meta{display:flex;gap:18px;margin-top:8px;padding:6px 12px;background:rgba(6,20,63,.55);clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%)}
.meta div{display:flex;flex-direction:column}
.meta small{font-size:9.5px;font-weight:800;letter-spacing:.18em;color:#a4b6e6;text-transform:uppercase}
.meta b{font-size:19px;font-weight:800;color:#f5f8ff;font-variant-numeric:tabular-nums}
.footer{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.footer-brand{font-size:9px;text-transform:uppercase}
.err{min-height:120px;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 12px;color:#ffb4a6;font-size:14px;line-height:1.3;letter-spacing:.04em}
</style>
<link rel="stylesheet" href="ov-theme.css">
</head>
<body>
<div class="card" id="card"><div class="card-inner" id="content"><div class="err">Cargando…</div></div></div>
<script>
// Tarjeta de tu cuenta de Steam: nivel, XP, antigüedad, biblioteca y horas totales.
const p = new URLSearchParams(location.search);
const ID = p.get('steamid') || '';
const API = ((window.BF6_CONFIG && window.BF6_CONFIG.api) || 'https://corillo.live/api/bf6/stats').replace('/bf6/stats', '/bf6/wardogs/profile') + '?steamid=' + encodeURIComponent(ID);
const MSG = { steam_key_missing: 'Tarjeta de Steam no disponible todavía', private_profile: 'El perfil de Steam es privado.<br>Ponlo en público para ver tu tarjeta.', game_details_private: 'Activa los detalles del juego en tu privacidad de Steam<br>(o esta cuenta no tiene WARDOGS).', not_found: 'No encontramos ese perfil de Steam.' };
const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => n == null ? '—' : Number(n).toLocaleString('en-US');
let good = false;
function since(ts){ if (!ts) return '—'; const y = new Date().getFullYear() - new Date(ts * 1000).getFullYear(); return y < 1 ? 'Este año' : y === 1 ? '1 año' : y + ' años'; }
async function load(refresh){
  const card = document.getElementById('card'), box = document.getElementById('content');
  if (!ID) { box.innerHTML = '<div class="err">Falta ?steamid= en la URL</div>'; return; }
  try {
    const r = await fetch(API); const d = await r.json();
    if (!r.ok) { if (!good) box.innerHTML = `<div class="err">${MSG[d.error] || 'Datos no disponibles'}</div>`; return; }
    good = true; const s = d.steam || {};
    if (refresh) { card.classList.add('refreshing'); setTimeout(() => card.classList.remove('refreshing'), 600); }
    const per = 100 * (Math.floor((s.level || 0) / 10) + 1);            // XP que cuesta cada nivel en ese tramo
    const pct = s.level != null && s.xpNext != null ? Math.max(0, Math.min(100, Math.round((per - s.xpNext) / per * 100))) : 0;
    box.innerHTML = `
      <div class="header"><span class="ava" style="background-image:url('${esc(d.avatar || '')}')"></span><span class="player-name">${esc(d.name)}</span><span class="platform-badge">STEAM</span></div>
      <div class="subheader"><span></span><span class="section-label"><span>//</span> MI CUENTA</span></div>
      <div class="divider"></div>
      <div class="row"><span class="stat-value-main kd big">${s.level == null ? '—' : s.level}</span><span class="unit">NIVEL DE STEAM</span></div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="xp">${s.xpNext != null ? `<b>${fmt(s.xpNext)} XP</b> para el nivel ${s.level + 1}` : ''}</div>
      <div class="meta">
        <div><small>Cuenta</small><b>${since(s.memberSince)}</b></div>
        <div><small>Juegos</small><b>${fmt(s.games)}</b></div>
        <div><small>Horas totales</small><b>${s.totalHours == null ? '—' : fmt(s.totalHours) + ' h'}</b></div>
      </div>
      <div class="footer"><span class="footer-brand">CORILLO.LIVE · STEAM</span><span class="footer-time">↻ ahora</span></div>`;
  } catch (e) { if (!good) box.innerHTML = '<div class="err">Datos no disponibles ahora</div>'; }
}
load(); setInterval(() => load(true), 5 * 60 * 1000);
</script>
</body>
</html>
