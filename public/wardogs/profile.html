<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>WARDOGS · Perfil — CORILLO</title>
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:transparent;width:380px;font-family:'Barlow Condensed',sans-serif}
.card{width:380px}
.header{display:flex;align-items:center;gap:10px;margin-bottom:2px}
.ava{width:34px;height:34px;flex:none;background:#173383 center/cover;clip-path:polygon(0 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%)}
.player-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subheader{display:flex;justify-content:space-between;margin-bottom:8px}
.big{font-size:56px !important;line-height:.9}
.row{display:flex;align-items:flex-end;gap:14px}
.unit{font-size:20px;font-weight:800;color:#a4b6e6;letter-spacing:.06em;padding-bottom:6px}
.meta{display:flex;gap:18px;margin-top:8px;padding:6px 12px;background:rgba(6,20,63,.55);clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%)}
.meta div{display:flex;flex-direction:column}
.meta small{font-size:9.5px;font-weight:800;letter-spacing:.18em;color:#a4b6e6;text-transform:uppercase}
.meta b{font-size:19px;font-weight:800;color:#f5f8ff;font-variant-numeric:tabular-nums}
.bar{height:5px;background:rgba(255,255,255,.12);margin-top:9px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ff6a3d,#ffd23f);box-shadow:0 0 12px rgba(255,106,61,.6)}
.recent{margin-top:6px;font-size:13px;font-weight:700;color:#a4b6e6;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent b{color:#ffd23f}
.footer{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.footer-brand{font-size:9px;text-transform:uppercase}
.live{display:inline-flex;align-items:center;gap:5px;padding:2px 9px 2px 7px;background:rgba(255,45,85,.22);color:#ff7a92;font-weight:800;font-size:12px;letter-spacing:.14em;clip-path:polygon(0 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%)}
.live i{width:7px;height:7px;border-radius:50%;background:#ff2d55;box-shadow:0 0 8px #ff2d55;animation:lv 1.2s ease-in-out infinite}
@keyframes lv{50%{opacity:.35}}
.recent{transition:opacity .35s}
.recent.fade{opacity:0}
.err{min-height:120px;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 12px;color:#ffb4a6;font-size:14px;line-height:1.3;letter-spacing:.04em}
</style>
<link rel="stylesheet" href="ov-theme.css">
</head>
<body>
<div class="card" id="card"><div class="card-inner" id="content"><div class="err">Cargando…</div></div></div>
<script>
const p = new URLSearchParams(location.search);
const ID = p.get('steamid') || '';
const DEMO = p.get('demo') === '1';   // datos de muestra, marcados como EJEMPLO: para la vista previa de la página
const AVA = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><rect width="40" height="40" fill="#173383"/><circle cx="20" cy="15" r="7" fill="#a4b6e6"/><path d="M6 40c0-9 6-14 14-14s14 5 14 14z" fill="#a4b6e6"/></svg>');
const SAMPLE = { name: 'Tu nombre', avatar: AVA, hours: 128.4, hours2w: 21.7, playingNow: true, lastPlayed: Math.floor(Date.now() / 1000) - 7200, achievements: { done: 6, total: 10, recent: [{ name: 'Long Shot', at: 1 }], rarest: { name: 'CZ Survivor', pct: 4.9 } }, session: { achievements: 1, hours: 1.2 } };
const API = ((window.BF6_CONFIG && window.BF6_CONFIG.api) || 'https://corillo.live/api/bf6/stats').replace('/bf6/stats', '/bf6/wardogs/profile') + '?steamid=' + encodeURIComponent(ID);
const MSG = { steam_key_missing: 'Perfil de WARDOGS no disponible todavía', private_profile: 'El perfil de Steam es privado.<br>Ponlo en público para ver tus stats.', game_details_private: 'Activa los detalles del juego en público<br>en la privacidad de tu perfil de Steam.', not_found: 'No encontramos ese perfil de Steam.' };
const fmt = (n, d = 0) => n == null ? '—' : Number(n).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pctTxt = n => n == null ? '' : (n < 10 ? n.toFixed(1) : Math.round(n)) + '%';
let good = false, lines = [], li = 0;
function noteLines(d){
  const a = d.achievements || {}, out = [], se = d.session || {};
  if (se.achievements > 0 || se.hours > 0) out.push('Esta sesión: <b>' + [se.achievements > 0 ? '+' + se.achievements + (se.achievements === 1 ? ' logro' : ' logros') : '', se.hours > 0 ? '+' + se.hours + ' h' : ''].filter(Boolean).join(' · ') + '</b>');
  if (d.lastPlayed) { const h = Math.max(0, Math.floor((Date.now() / 1000 - d.lastPlayed) / 3600)); out.push('Última partida: <b>' + (h < 1 ? 'hace menos de 1 h' : h < 48 ? 'hace ' + h + ' h' : 'hace ' + Math.floor(h / 24) + ' días') + '</b>'); }
  if (a.rarest) out.push('Logro más raro: <b>' + esc(a.rarest.name) + '</b> · solo el ' + pctTxt(a.rarest.pct) + ' lo tiene');
  if (a.recent && a.recent[0]) out.push('Último logro: <b>' + esc(a.recent[0].name) + '</b>');
  return out;
}
setInterval(() => {
  const el = document.getElementById('note'); if (!el || lines.length < 2) return;
  el.classList.add('fade'); setTimeout(() => { li = (li + 1) % lines.length; el.innerHTML = lines[li]; el.classList.remove('fade'); }, 350);
}, 6000);
async function load(refresh){
  const card = document.getElementById('card');
  if (!ID && !DEMO) { document.getElementById('content').innerHTML = '<div class="err">Falta ?steamid= en la URL</div>'; return; }
  try {
    const r = DEMO ? { ok: true } : await fetch(API); const d = DEMO ? SAMPLE : await r.json();
    if (!r.ok) { if (!good) document.getElementById('content').innerHTML = `<div class="err">${MSG[d.error] || 'Datos no disponibles'}</div>`; return; }
    good = true;
    if (refresh) { card.classList.add('refreshing'); setTimeout(() => card.classList.remove('refreshing'), 600); }
    lines = noteLines(d); if (li >= lines.length) li = 0;
    const a = d.achievements || { done: 0, total: 0, recent: [] }; const pct = a.total ? Math.round(a.done / a.total * 100) : 0;
    document.getElementById('content').innerHTML = `
      <div class="header"><span class="ava" style="background-image:url('${esc(d.avatar || '')}')"></span><span class="player-name">${esc(d.name)}</span>${d.playingNow ? '<span class="live"><i></i>JUGANDO</span>' : ''}<span class="platform-badge">STEAM</span></div>
      <div class="subheader"><span></span><span class="section-label"><span>//</span> ${DEMO ? 'TU PERFIL · EJEMPLO' : 'WARDOGS'}</span></div>
      <div class="divider"></div>
      <div class="row"><span class="stat-value-main kd big">${fmt(d.hours, 1)}</span><span class="unit">HORAS JUGADAS</span></div>
      <div class="meta">
        <div><small>Últimas 2 semanas</small><b>${fmt(d.hours2w, 1)} h</b></div>
        <div><small>Logros</small><b>${a.done} / ${a.total}</b></div>
        <div><small>Completado</small><b>${pct}%</b></div>
      </div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="recent" id="note">${lines[li] || ''}</div>
      <div class="footer"><span class="footer-brand">${DEMO ? 'EJEMPLO · ' : ''}CORILLO.LIVE · WARDOGS</span><span class="footer-time">↻ ahora</span></div>`;
  } catch (e) { if (!good) document.getElementById('content').innerHTML = '<div class="err">Datos no disponibles ahora</div>'; }
}
load(); setInterval(() => load(true), 5 * 60 * 1000);
</script>
</body>
</html>
