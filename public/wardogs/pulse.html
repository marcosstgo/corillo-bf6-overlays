<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>WARDOGS · Jugadores en vivo — CORILLO</title>
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:transparent;width:380px;font-family:'Barlow Condensed',sans-serif}
.card{width:380px}
.header{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.player-name{flex:1;text-transform:uppercase;white-space:nowrap}
.subheader{display:flex;justify-content:space-between;margin-bottom:8px}
.section-label{font-size:10px;text-transform:uppercase}
.row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.big{font-size:62px !important;line-height:.9}
.delta{display:inline-flex;align-items:center;gap:5px;padding:4px 10px 4px 8px;background:rgba(53,224,161,.18);color:#35e0a1;font-weight:800;font-size:15px;letter-spacing:.04em;clip-path:polygon(0 0,100% 0,calc(100% - 7px) 100%,0 100%)}
.delta.down{background:rgba(255,45,85,.2);color:#ff7a92}
.spark{width:120px;height:44px;flex:none}
.meta{display:flex;gap:18px;margin-top:8px;padding:6px 12px;background:rgba(6,20,63,.55);clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%)}
.meta div{display:flex;flex-direction:column}
.meta small{font-size:9.5px;font-weight:800;letter-spacing:.18em;color:#a4b6e6;text-transform:uppercase}
.meta b{font-size:19px;font-weight:800;color:#f5f8ff;font-variant-numeric:tabular-nums}
.footer{display:flex;justify-content:space-between;align-items:center;margin-top:7px}
.footer-brand{font-size:9px;text-transform:uppercase}
.footer-time{font-size:10px}
.err{min-height:110px;display:flex;align-items:center;justify-content:center;color:#ffb4a6;font-size:14px;letter-spacing:.06em}
</style>
<link rel="stylesheet" href="ov-theme.css">
</head>
<body>
<div class="card" id="card"><div class="card-inner" id="content"><div class="err">Cargando…</div></div></div>
<script>
const API = ((window.BF6_CONFIG && window.BF6_CONFIG.api) || 'https://corillo.live/api/bf6/stats').replace('/bf6/stats', '/bf6/wardogs/players');
const fmt = n => Number(n).toLocaleString('en-US');
let last = 0;
function spark(v){
  if (!v || v.length < 2) return '';
  const lo = Math.min(...v), hi = Math.max(...v), r = Math.max(hi - lo, hi * 0.04) || 1, mn = lo - (r - (hi - lo)) / 2;   // rango mínimo: 0.1 % de variación no debe verse como un desplome
  const pts = v.map((n, i) => `${(i / (v.length - 1) * 120).toFixed(1)},${(40 - (n - mn) / r * 36).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 120 44" preserveAspectRatio="none"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#ff6a3d"/><stop offset="1" stop-color="#ffd23f"/></linearGradient></defs><polyline points="${pts}" fill="none" stroke="url(#g)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}
function ago(){ if (!last) return ''; const m = Math.floor((Date.now() - last) / 60000); return m < 1 ? '↻ ahora' : `↻ ${m} min`; }
async function load(refresh){
  const card = document.getElementById('card');
  try {
    const r = await fetch(API); const d = await r.json();
    if (!r.ok) throw new Error(d.error || r.status);
    last = Date.now();
    if (refresh) { card.classList.add('refreshing'); setTimeout(() => card.classList.remove('refreshing'), 600); }
    const up = d.deltaPct >= 0;
    document.getElementById('content').innerHTML = `
      <div class="header"><span class="player-name">WARDOGS</span><span class="platform-badge">STEAM</span></div>
      <div class="subheader"><span></span><span class="section-label"><span>//</span> JUGANDO AHORA</span></div>
      <div class="divider"></div>
      <div class="row"><span class="stat-value-main kd big">${fmt(d.players)}</span>${spark(d.spark)}</div>
      <div class="meta">
        <div><small>Últimos 30 min</small><b><span class="delta ${up ? '' : 'down'}">${up ? '▲' : '▼'} ${Math.abs(d.deltaPct)}%</span></b></div>
        <div><small>Récord (24 h)</small><b>${fmt(d.peak)}</b></div>
      </div>
      <div class="footer"><span class="footer-brand">CORILLO.LIVE · WARDOGS</span><span class="footer-time">${ago()}</span></div>`;
  } catch (e) {
    if (!last) document.getElementById('content').innerHTML = '<div class="err">WARDOGS: datos no disponibles ahora</div>';
  }
}
load(); setInterval(() => load(true), 60000); setInterval(() => { const f = document.querySelector('.footer-time'); if (f) f.textContent = ago(); }, 30000);
</script>
</body>
</html>
