<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BF6 Objective Overlay</title>
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{background:transparent;width:380px;font-family:'Barlow Condensed',sans-serif;-webkit-font-smoothing:antialiased}
  .card{width:380px;background:rgba(0,0,0,0.82);border-radius:12px;border-left:3px solid #3ecf6e;overflow:hidden;backdrop-filter:blur(6px);box-shadow:0 4px 32px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.04);position:relative}
  .card::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.08) 2px,rgba(0,0,0,.08) 4px);pointer-events:none;z-index:1}
  .card-inner{position:relative;z-index:2;padding:14px 16px 12px}
  .header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .player-name{font-size:16px;font-weight:800;color:#fff;letter-spacing:.04em;text-transform:uppercase;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .section-label{font-size:10px;font-weight:700;letter-spacing:.15em;color:#3ecf6e;text-transform:uppercase;white-space:nowrap}
  .divider{height:1px;background:linear-gradient(90deg,#3ecf6e 0%,rgba(62,207,110,.15) 60%,transparent 100%);margin-bottom:10px}

  .top-stats{display:flex;gap:0;margin-bottom:12px}
  .top-stat{flex:1;display:flex;flex-direction:column;gap:2px}
  .top-stat+.top-stat{border-left:1px solid rgba(255,255,255,.07);padding-left:16px}
  .top-stat:first-child{padding-right:16px}
  .top-label{font-size:10px;font-weight:700;letter-spacing:.12em;color:rgba(255,255,255,.35);text-transform:uppercase}
  .top-value{font-family:'Share Tech Mono',monospace;font-size:38px;line-height:1;color:#fff;letter-spacing:-.02em}
  .top-value.green{color:#3ecf6e}
  .top-sub{font-size:10px;color:rgba(255,255,255,.3);letter-spacing:.06em;margin-top:1px}

  .row{display:flex;justify-content:space-between;background:rgba(255,255,255,.03);border-radius:6px;padding:8px 12px;margin-bottom:6px;border:1px solid rgba(255,255,255,.05)}
  .row:last-of-type{margin-bottom:10px}
  .stat-minor{display:flex;flex-direction:column;align-items:center;gap:3px}
  .stat-minor-label{font-size:9px;font-weight:700;letter-spacing:.1em;color:rgba(255,255,255,.3);text-transform:uppercase;text-align:center}
  .stat-minor-value{font-family:'Share Tech Mono',monospace;font-size:14px;color:#fff;letter-spacing:.02em}
  .stat-minor-value.green{color:#3ecf6e}

  .footer{display:flex;justify-content:space-between;align-items:center}
  .footer-brand{font-size:9px;font-weight:700;letter-spacing:.15em;color:rgba(62,207,110,.45);text-transform:uppercase}
  .footer-time{font-family:'Share Tech Mono',monospace;font-size:9px;color:rgba(255,255,255,.2)}

  .loading{display:flex;align-items:center;gap:8px;justify-content:center;min-height:160px}
  .loading-dot{width:6px;height:6px;border-radius:50%;background:#3ecf6e;animation:pulse 1.2s ease-in-out infinite}
  .loading-dot:nth-child(2){animation-delay:.2s}
  .loading-dot:nth-child(3){animation-delay:.4s}
  @keyframes pulse{0%,80%,100%{opacity:.15;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
  .error-msg{font-size:11px;color:rgba(255,80,80,.7);text-align:center;min-height:160px;display:flex;align-items:center;justify-content:center;line-height:1.6}
  .error-msg .err-sub{font-size:9px;opacity:.5;letter-spacing:.08em;display:block;margin-top:3px}
  @keyframes flash-border{0%{border-left-color:#3ecf6e}50%{border-left-color:rgba(62,207,110,.3)}100%{border-left-color:#3ecf6e}}
  .card.refreshing{animation:flash-border .5s ease}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="card-inner" id="content">
    <div class="loading"><div class="loading-dot"></div><div class="loading-dot"></div><div class="loading-dot"></div></div>
  </div>
</div>
<script>
const p=new URLSearchParams(location.search);
const PLAYER=p.get('name')||'katat0nia';
const PLATFORM=p.get('platform')||'ea';
const API=`${window.BF6_CONFIG?.api||'https://corillo.live/api/bf6/stats'}?name=${encodeURIComponent(PLAYER)}&platform=${encodeURIComponent(PLATFORM)}`;
const INTERVAL=60000;
let lastGoodData=null,lastUpdatedAt=null,ftTimer=null,isStale=false;
function relTime(){if(!lastUpdatedAt)return'↻ ahora';const m=Math.floor((Date.now()-lastUpdatedAt)/60000);return m<1?'↻ ahora':m===1?'↻ 1 min':`↻ ${m} min`}
function tickFooter(){if(isStale)return;const ft=document.querySelector('.footer-time');if(ft)ft.textContent=relTime()}

function fmt(n){if(n==null||isNaN(Number(n)))return'—';return Number(n).toLocaleString('en-US')}
function nowTime(){return new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false})}
function fmtSecs(s){if(!s)return'0h';const h=Math.floor(s/3600),m=Math.floor((s%3600)/60);return h>=100?`${h}h`:h>0?`${h}h ${m}m`:`${m}m`}

function renderObjective(data){
  const obj=data.objective||{};
  const objTime=obj.time||{};
  document.getElementById('content').innerHTML=`
    <div class="header">
      <span class="player-name">${data.userName||PLAYER}</span>
      <span class="section-label">OBJECTIVE</span>
    </div>
    <div class="divider"></div>
    <div class="top-stats">
      <div class="top-stat">
        <span class="top-label">Obj. Capturados</span>
        <span class="top-value green">${fmt(obj.captured)}</span>
        <span class="top-sub">${fmt(data.sector?.captured)} sectores</span>
      </div>
      <div class="top-stat">
        <span class="top-label">Tiempo en Obj.</span>
        <span class="top-value">${fmtSecs(objTime.total)}</span>
        <span class="top-sub">${fmtSecs(objTime.defended)} defensa</span>
      </div>
    </div>
    <div class="row">
      <div class="stat-minor"><span class="stat-minor-label">Revives</span><span class="stat-minor-value green">${fmt(data.revives)}</span></div>
      <div class="stat-minor"><span class="stat-minor-label">Heals</span><span class="stat-minor-value">${fmt(data.heals)}</span></div>
      <div class="stat-minor"><span class="stat-minor-label">Resupplies</span><span class="stat-minor-value">${fmt(data.resupplies)}</span></div>
      <div class="stat-minor"><span class="stat-minor-label">Repairs</span><span class="stat-minor-value">${fmt(data.repairs)}</span></div>
    </div>
    <div class="row">
      <div class="stat-minor"><span class="stat-minor-label">Assists</span><span class="stat-minor-value">${fmt(data.killAssists)}</span></div>
      <div class="stat-minor"><span class="stat-minor-label">Spotted</span><span class="stat-minor-value">${fmt(data.enemiesSpotted)}</span></div>
      <div class="stat-minor"><span class="stat-minor-label">Saviors</span><span class="stat-minor-value green">${fmt(data.saviorKills)}</span></div>
      <div class="stat-minor"><span class="stat-minor-label">Gadgets</span><span class="stat-minor-value">${fmt(data.gadgetsDestoyed)}</span></div>
    </div>
    <div class="footer"><span class="footer-brand">CORILLO.LIVE · BF6</span><span class="footer-time">↻ ahora</span></div>`;
}

function getErrType(status,data){
  const msg=(data?.errors?.[0]?.message||data?.message||'').toLowerCase();
  if(status===404||msg.includes('not found'))return'not_found';
  if(status===504||status===502)return'timeout';
  return'generic';
}
function renderError(type){
  const icon=type==='not_found'?'⚠':'↻';
  const line1=type==='not_found'?`Jugador "${PLAYER}" no encontrado`:type==='timeout'?'API sin respuesta':'Stats no disponibles';
  const sub=type==='not_found'?'Verifica nombre y plataforma en la URL':'Reintentando en 60 seg';
  document.getElementById('content').innerHTML=`<div class="error-msg"><div><div style="font-size:20px;margin-bottom:5px;opacity:.4">${icon}</div><div>${line1}</div><span class="err-sub">${sub}</span></div></div>`;
}
function markStale(){isStale=true;const ft=document.querySelector('.footer-time');if(!ft)return;ft.textContent='⚠ sin actualizar';ft.style.color='rgba(255,180,0,.65)'}
function unmarkStale(){isStale=false;const ft=document.querySelector('.footer-time');if(!ft)return;ft.style.color='';ft.textContent=relTime()}
async function fetchStats(isRefresh=false){
  const card=document.getElementById('card');
  if(isRefresh&&lastGoodData){card.classList.add('refreshing');setTimeout(()=>card.classList.remove('refreshing'),500)}
  try{
    const res=await fetch(API);
    const data=await res.json();
    if(!res.ok||data.error){
      if(isRefresh&&lastGoodData){markStale();return}
      renderError(getErrType(res.status,data));return;
    }
    lastGoodData=data;lastUpdatedAt=Date.now();
    if(!ftTimer)ftTimer=setInterval(tickFooter,30000);
    if(isRefresh)unmarkStale();
    renderObjective(data);
  }catch(e){
    if(isRefresh&&lastGoodData){markStale();return}
    renderError('timeout');
    console.warn('BF6 obj:',e.message);
  }
}
fetchStats();
setInterval(()=>fetchStats(true),INTERVAL);
</script>
</body>
</html>
