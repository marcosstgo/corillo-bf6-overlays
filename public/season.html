<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BF6 Season Overlay</title>
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{background:transparent;width:380px;font-family:'Barlow Condensed',sans-serif;-webkit-font-smoothing:antialiased}
  .card{width:380px;background:rgba(0,0,0,0.82);border-radius:12px;border-left:3px solid #3ecf6e;overflow:hidden;backdrop-filter:blur(6px);box-shadow:0 4px 32px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.04);position:relative}
  .card::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.08) 2px,rgba(0,0,0,.08) 4px);pointer-events:none;border-radius:12px;z-index:1}
  .card-inner{position:relative;z-index:2;padding:14px 16px 12px}
  .header{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .player-name{font-size:18px;font-weight:800;color:#fff;letter-spacing:.04em;text-transform:uppercase;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .season-badge{background:rgba(62,207,110,.15);border:1px solid rgba(62,207,110,.4);color:#3ecf6e;font-size:10px;font-weight:700;letter-spacing:.08em;padding:3px 8px;border-radius:20px;text-transform:uppercase;white-space:nowrap;flex-shrink:0}
  .divider{height:1px;background:linear-gradient(90deg,#3ecf6e 0%,rgba(62,207,110,.15) 60%,transparent 100%);margin-bottom:12px}
  .center-stats{display:flex;gap:0;margin-bottom:14px}
  .stat-main{flex:1;display:flex;flex-direction:column;gap:2px}
  .stat-main+.stat-main{border-left:1px solid rgba(255,255,255,.07);padding-left:20px}
  .stat-main:first-child{padding-right:20px}
  .stat-label-main{font-size:10px;font-weight:700;letter-spacing:.14em;color:rgba(255,255,255,.35);text-transform:uppercase}
  .stat-value-main{font-family:'Share Tech Mono',monospace;font-size:52px;line-height:1;font-weight:400;letter-spacing:-.02em}
  .stat-value-main.kd{color:#3ecf6e}
  .stat-value-main.kills{color:#fff}
  .bottom-row{display:flex;justify-content:space-between;background:rgba(255,255,255,.03);border-radius:6px;padding:8px 12px;margin-bottom:10px;border:1px solid rgba(255,255,255,.05)}
  .stat-minor{display:flex;flex-direction:column;align-items:center;gap:3px}
  .stat-minor-label{font-size:9px;font-weight:700;letter-spacing:.12em;color:rgba(255,255,255,.3);text-transform:uppercase}
  .stat-minor-value{font-family:'Share Tech Mono',monospace;font-size:15px;color:#fff;letter-spacing:.02em}
  .footer{display:flex;justify-content:space-between;align-items:center}
  .footer-left{display:flex;flex-direction:column;gap:1px}
  .footer-fav{font-size:8px;font-weight:700;letter-spacing:.1em;color:rgba(62,207,110,.45);text-transform:uppercase}
  .footer-time{font-family:'Share Tech Mono',monospace;font-size:9px;color:rgba(255,255,255,.2);letter-spacing:.05em}
  .loading{display:flex;align-items:center;gap:8px;justify-content:center;min-height:120px}
  .loading-dot{width:6px;height:6px;border-radius:50%;background:#3ecf6e;animation:pulse 1.2s ease-in-out infinite}
  .loading-dot:nth-child(2){animation-delay:.2s}
  .loading-dot:nth-child(3){animation-delay:.4s}
  @keyframes pulse{0%,80%,100%{opacity:.15;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
  .error-msg{font-size:11px;color:rgba(255,80,80,.7);text-align:center;min-height:120px;display:flex;align-items:center;justify-content:center;line-height:1.6}
  .error-msg .err-sub{font-size:9px;opacity:.5;letter-spacing:.08em;display:block;margin-top:3px}
  @keyframes flash-border{0%{border-left-color:#3ecf6e}50%{border-left-color:rgba(62,207,110,.3)}100%{border-left-color:#3ecf6e}}
  .card.refreshing{animation:flash-border .5s ease}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="card-inner" id="content">
    <div class="loading"><div class="loading-dot"></div><div class="loading-dot"></div><div class="loading-dot"></div></div>
  </div>
</div>
<script>
const p=new URLSearchParams(location.search);
const PLAYER=p.get('name')||'katat0nia';
const BASE_API=window.BF6_CONFIG?.api||'https://corillo.live/api/bf6/stats';
const API=`${BASE_API.replace('/bf6/stats','/bf6/eastats')}?name=${encodeURIComponent(PLAYER)}`;
const INTERVAL=60000;
let lastGoodData=null,lastUpdatedAt=null,ftTimer=null,isStale=false;
function relTime(){if(!lastUpdatedAt)return'↻ ahora';const m=Math.floor((Date.now()-lastUpdatedAt)/60000);return m<1?'↻ ahora':m===1?'↻ 1 min':`↻ ${m} min`}
function tickFooter(){if(isStale)return;const ft=document.querySelector('.footer-time');if(ft)ft.textContent=relTime()}

function renderStats(d){
  const s=d.season;
  const modeShort=d.favoriteMode?d.favoriteMode.replace('Team ','').replace('Deathmatch','TDM').replace('Breakthrough','BTH').replace('Conquest','CQS'):null;
  document.getElementById('content').innerHTML=`
    <div class="header">
      <span class="player-name">${d.displayName||PLAYER}</span>
      <span class="season-badge">TEMPORADA</span>
    </div>
    <div class="divider"></div>
    <div class="center-stats">
      <div class="stat-main"><span class="stat-label-main">K/D</span><span class="stat-value-main kd">${s.killDeath||'—'}</span></div>
      <div class="stat-main"><span class="stat-label-main">Kills</span><span class="stat-value-main kills">${s.kills||'—'}</span></div>
    </div>
    <div class="bottom-row">
      <div class="stat-minor"><span class="stat-minor-label">Win%</span><span class="stat-minor-value">${s.winRate||'—'}</span></div>
      <div class="stat-minor"><span class="stat-minor-label">Partidas</span><span class="stat-minor-value">${s.matchesPlayed||'—'}</span></div>
      <div class="stat-minor"><span class="stat-minor-label">Accuracy</span><span class="stat-minor-value">${s.shotAccuracy||'—'}</span></div>
      <div class="stat-minor"><span class="stat-minor-label">HS Rate</span><span class="stat-minor-value">${s.headshotRate||'—'}</span></div>
    </div>
    <div class="footer">
      <div class="footer-left">
        <span class="footer-fav">${[modeShort,d.favoriteClass].filter(Boolean).join(' · ')}</span>
        <span style="font-size:8px;color:rgba(62,207,110,.3);letter-spacing:.08em">CORILLO.LIVE · BF6</span>
      </div>
      <span class="footer-time">↻ ahora</span>
    </div>`;
}

function renderError(type){
  const icon=type==='not_found'?'⚠':'↻';
  const line1=type==='not_found'?`"${PLAYER}" no encontrado`:type==='timeout'?'EA sin respuesta':'Stats no disponibles';
  const sub=type==='not_found'?'Verifica el nombre en la URL':'Reintentando en 60 seg';
  document.getElementById('content').innerHTML=`<div class="error-msg"><div><div style="font-size:20px;margin-bottom:5px;opacity:.4">${icon}</div><div>${line1}</div><span class="err-sub">${sub}</span></div></div>`;
}
function markStale(){isStale=true;const ft=document.querySelector('.footer-time');if(!ft)return;ft.textContent='⚠ sin actualizar';ft.style.color='rgba(255,180,0,.65)'}
function unmarkStale(){isStale=false;const ft=document.querySelector('.footer-time');if(!ft)return;ft.style.color='';ft.textContent=relTime()}

async function fetchStats(isRefresh=false){
  const card=document.getElementById('card');
  if(isRefresh&&lastGoodData){card.classList.add('refreshing');setTimeout(()=>card.classList.remove('refreshing'),500)}
  try{
    const res=await fetch(API);
    const data=await res.json();
    if(!res.ok||data.error){
      if(isRefresh&&lastGoodData){markStale();return}
      const status=res.status;
      renderError(status===404?'not_found':status===504||status===502?'timeout':'generic');return;
    }
    lastGoodData=data;lastUpdatedAt=Date.now();
    if(!ftTimer)ftTimer=setInterval(tickFooter,30000);
    if(isRefresh)unmarkStale();
    renderStats(data);
  }catch(e){
    if(isRefresh&&lastGoodData){markStale();return}
    renderError('timeout');
    console.warn('BF6 season:',e.message);
  }
}
fetchStats();
setInterval(()=>fetchStats(true),INTERVAL);
</script>
</body>
</html>
