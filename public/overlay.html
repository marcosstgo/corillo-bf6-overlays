<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BF6 Stats Overlay</title>
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{background:transparent;width:380px;font-family:'Barlow Condensed',sans-serif;-webkit-font-smoothing:antialiased}
  .card{width:380px;background:rgba(0,0,0,0.82);border-radius:12px;border-left:3px solid #3ecf6e;overflow:hidden;backdrop-filter:blur(6px);box-shadow:0 4px 32px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.04);position:relative}
  .card::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.08) 2px,rgba(0,0,0,.08) 4px);pointer-events:none;border-radius:12px;z-index:1}
  .card-inner{position:relative;z-index:2;padding:13px 16px 11px}
  .header{display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .player-name{font-size:18px;font-weight:900;color:#fff;letter-spacing:.04em;text-transform:uppercase;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .platform-badge{background:rgba(62,207,110,.15);border:1px solid rgba(62,207,110,.4);color:#3ecf6e;font-size:10px;font-weight:700;letter-spacing:.08em;padding:3px 8px;border-radius:20px;text-transform:uppercase;white-space:nowrap;flex-shrink:0}
  .subheader{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .time-played{font-family:'Share Tech Mono',monospace;font-size:11px;color:rgba(255,255,255,.32);letter-spacing:.06em}
  .section-label{font-size:10px;font-weight:800;letter-spacing:.14em;color:rgba(255,255,255,.22);text-transform:uppercase}
  .section-label span{color:#3ecf6e;opacity:.8;margin-right:3px}
  .divider{height:1px;background:linear-gradient(90deg,rgba(62,207,110,.5) 0%,rgba(62,207,110,.08) 50%,transparent 100%);margin-bottom:10px}
  .center-stats{display:flex;gap:0;margin-bottom:12px}
  .stat-main{flex:1;display:flex;flex-direction:column;gap:2px;padding:0 6px}
  .stat-main:first-child{padding-left:0}
  .stat-main.kd-col{background:rgba(62,207,110,.05);border-radius:8px;padding:6px 10px;border:1px solid rgba(62,207,110,.1)}
  .stat-label-main{font-size:9px;font-weight:700;letter-spacing:.16em;color:rgba(255,255,255,.3);text-transform:uppercase}
  .stat-value-main{font-family:'Share Tech Mono',monospace;font-size:50px;line-height:1;font-weight:400;letter-spacing:-.02em}
  .stat-value-main.kills{color:#fff}
  .stat-value-main.kd{color:#3ecf6e}
  .bottom-row{display:flex;justify-content:space-between;background:rgba(255,255,255,.03);border-radius:6px;padding:7px 12px;margin-bottom:9px;border:1px solid rgba(255,255,255,.05)}
  .stat-minor{display:flex;flex-direction:column;align-items:center;gap:3px}
  .stat-minor-label{font-size:9px;font-weight:700;letter-spacing:.12em;color:rgba(255,255,255,.28);text-transform:uppercase}
  .stat-minor-value{font-family:'Share Tech Mono',monospace;font-size:15px;color:#fff;letter-spacing:.02em}
  .footer{display:flex;justify-content:space-between;align-items:center}
  .footer-brand{font-size:9px;font-weight:700;letter-spacing:.15em;color:rgba(62,207,110,.35);text-transform:uppercase}
  .footer-time{font-family:'Share Tech Mono',monospace;font-size:9px;color:rgba(255,255,255,.2);letter-spacing:.05em}
  .loading{display:flex;align-items:center;gap:8px;justify-content:center;min-height:120px}
  .loading-dot{width:6px;height:6px;border-radius:50%;background:#3ecf6e;animation:pulse 1.2s ease-in-out infinite}
  .loading-dot:nth-child(2){animation-delay:.2s}
  .loading-dot:nth-child(3){animation-delay:.4s}
  @keyframes pulse{0%,80%,100%{opacity:.15;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
  .error-msg{font-size:11px;color:rgba(255,80,80,.7);text-align:center;min-height:120px;display:flex;align-items:center;justify-content:center;letter-spacing:.05em;line-height:1.6}
  .error-msg .err-sub{font-size:9px;opacity:.5;letter-spacing:.08em;display:block;margin-top:3px}
  @keyframes flash-border{0%{border-left-color:#3ecf6e}50%{border-left-color:rgba(62,207,110,.3)}100%{border-left-color:#3ecf6e}}
  .card.refreshing{animation:flash-border .5s ease}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="card-inner" id="content">
    <div class="loading"><div class="loading-dot"></div><div class="loading-dot"></div><div class="loading-dot"></div></div>
  </div>
</div>
<script>
const p = new URLSearchParams(location.search);
const PLAYER = p.get('name') || 'katat0nia';
const PLATFORM = p.get('platform') || 'ea';
const PLATFORM_LABEL = {ea:'EA',steam:'STEAM',psn:'PSN',xbox:'XBOX',ps5:'PS5',epic:'EPIC'}[PLATFORM] || PLATFORM.toUpperCase();
const API = `${window.BF6_CONFIG?.api||'https://corillo.live/api/bf6/stats'}?name=${encodeURIComponent(PLAYER)}&platform=${encodeURIComponent(PLATFORM)}`;
const INTERVAL = 60000;
let lastGoodData=null,lastUpdatedAt=null,ftTimer=null,isStale=false;
function relTime(){if(!lastUpdatedAt)return'↻ ahora';const m=Math.floor((Date.now()-lastUpdatedAt)/60000);return m<1?'↻ ahora':m===1?'↻ 1 min':`↻ ${m} min`}
function tickFooter(){if(isStale)return;const ft=document.querySelector('.footer-time');if(ft)ft.textContent=relTime()}

function fmt(n,d=0){if(n==null||isNaN(Number(n)))return'—';return Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d})}
function fmtTime(v){if(!v||v==='0:00:00')return'0h';if(typeof v==='string'){const dm=v.match(/(\d+)\s*days?,\s*(\d+):(\d+)/);if(dm){const t=parseInt(dm[1])*24+parseInt(dm[2]);return t>=100?`${t}h`:`${t}h ${dm[3]}m`}if(v.includes(':')){const pts=v.split(':').map(Number);const h=pts[0],m=pts[1]||0;return h>=100?`${h}h`:h>0?`${h}h ${m}m`:`${m}m`}}const s=Number(v);if(isNaN(s))return v;const h=Math.floor(s/3600),m=Math.floor((s%3600)/60);return h>=100?`${h}h`:h>0?`${h}h ${m}m`:`${m}m`}
function fmtWin(v){if(v==null)return'—';if(typeof v==='string')return v.includes('%')?v:v+'%';return Number(v).toFixed(1)+'%'}
function nowTime(){return new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false})}

function renderStats(data){
  document.getElementById('content').innerHTML=`
    <div class="header">
      <span class="player-name">${data.userName||PLAYER}</span>
      <span class="platform-badge">${PLATFORM_LABEL}</span>
    </div>
    <div class="subheader">
      <span class="time-played">${fmtTime(data.timePlayed)}</span>
      <span class="section-label"><span>//</span> LIFETIME</span>
    </div>
    <div class="divider"></div>
    <div class="center-stats">
      <div class="stat-main"><span class="stat-label-main">Total Kills</span><span class="stat-value-main kills">${fmt(data.kills)}</span></div>
      <div class="stat-main kd-col"><span class="stat-label-main">K/D Ratio</span><span class="stat-value-main kd">${fmt(data.killDeath,2)}</span></div>
    </div>
    <div class="bottom-row">
      <div class="stat-minor"><span class="stat-minor-label">DPM</span><span class="stat-minor-value">${fmt(data.damagePerMinute,0)}</span></div>
      <div class="stat-minor"><span class="stat-minor-label">KPM</span><span class="stat-minor-value">${fmt(data.killsPerMinute,2)}</span></div>
      <div class="stat-minor"><span class="stat-minor-label">Win Rate</span><span class="stat-minor-value">${fmtWin(data.winPercent)}</span></div>
      <div class="stat-minor"><span class="stat-minor-label">Matches</span><span class="stat-minor-value">${fmt(data.matchesPlayed)}</span></div>
    </div>
    <div class="footer"><span class="footer-brand">CORILLO.LIVE · BF6</span><span class="footer-time">↻ ahora</span></div>`;
}
function getErrType(status, data){
  const msg=(data?.errors?.[0]?.message||data?.message||'').toLowerCase();
  if(status===404||msg.includes('not found'))return'not_found';
  if(status===504||status===502)return'timeout';
  return'generic';
}
function renderError(type){
  const icon=type==='not_found'?'⚠':'↻';
  const line1=type==='not_found'?`Jugador "${PLAYER}" no encontrado`:type==='timeout'?'API sin respuesta':'Stats no disponibles';
  const sub=type==='not_found'?'Verifica nombre y plataforma en la URL':'Reintentando en 60 seg';
  document.getElementById('content').innerHTML=`<div class="error-msg"><div><div style="font-size:20px;margin-bottom:5px;opacity:.4">${icon}</div><div>${line1}</div><span class="err-sub">${sub}</span></div></div>`;
}
function markStale(){isStale=true;const ft=document.querySelector('.footer-time');if(!ft)return;ft.textContent='⚠ sin actualizar';ft.style.color='rgba(255,180,0,.65)'}
function unmarkStale(){isStale=false;const ft=document.querySelector('.footer-time');if(!ft)return;ft.style.color='';ft.textContent=relTime()}
async function fetchStats(isRefresh=false){
  const card=document.getElementById('card');
  if(isRefresh&&lastGoodData){card.classList.add('refreshing');setTimeout(()=>card.classList.remove('refreshing'),500)}
  try{
    const res=await fetch(API);
    const data=await res.json();
    if(!res.ok||data.error){
      if(isRefresh&&lastGoodData){markStale();return}
      renderError(getErrType(res.status,data));return;
    }
    lastGoodData=data;lastUpdatedAt=Date.now();
    if(!ftTimer)ftTimer=setInterval(tickFooter,30000);
    if(isRefresh)unmarkStale();
    renderStats(data);
  }catch(e){
    if(isRefresh&&lastGoodData){markStale();return}
    renderError('timeout');
    console.warn('BF6 fetch:',e.message);
  }
}
fetchStats();
setInterval(()=>fetchStats(true),INTERVAL);
</script>
</body>
</html>
