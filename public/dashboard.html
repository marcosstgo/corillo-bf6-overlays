<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BF6 Dashboard — CORILLO</title>
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:rgba(0,0,0,.93);width:1920px;height:1080px;overflow:hidden;font-family:'Barlow Condensed',sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.055) 2px,rgba(0,0,0,.055) 4px);pointer-events:none;z-index:100}

.topline{height:3px;background:linear-gradient(90deg,#3ecf6e 0%,rgba(62,207,110,.35) 70%,transparent 100%);flex-shrink:0}

/* HEADER */
.hdr{height:88px;display:flex;align-items:center;gap:20px;padding:0 40px;border-bottom:1px solid rgba(62,207,110,.12);flex-shrink:0;background:rgba(62,207,110,.02)}
.game-tag{background:rgba(62,207,110,.1);border:1px solid rgba(62,207,110,.3);color:#3ecf6e;font-size:11px;font-weight:800;letter-spacing:.2em;padding:5px 14px;border-radius:4px;text-transform:uppercase;flex-shrink:0}
.hdr-name{font-size:38px;font-weight:800;color:#fff;letter-spacing:.05em;text-transform:uppercase;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-right{display:flex;align-items:center;gap:16px;flex-shrink:0}
.plat-badge{background:rgba(62,207,110,.1);border:1px solid rgba(62,207,110,.3);color:#3ecf6e;font-size:11px;font-weight:700;letter-spacing:.1em;padding:4px 14px;border-radius:20px;text-transform:uppercase}
.hdr-meta{font-family:'Share Tech Mono',monospace;font-size:12px;color:rgba(255,255,255,.28);letter-spacing:.05em}
.hdr-sep{width:1px;height:24px;background:rgba(255,255,255,.1)}
.hdr-ts{font-family:'Share Tech Mono',monospace;font-size:11px;color:rgba(62,207,110,.55);letter-spacing:.06em;min-width:80px;text-align:right}
.toggle-wrap{display:flex;background:rgba(255,255,255,.06);border-radius:6px;padding:2px;gap:2px;flex-shrink:0}
.tbtn{font-size:9px;font-weight:800;letter-spacing:.14em;color:rgba(255,255,255,.28);padding:6px 18px;border-radius:4px;border:none;background:none;cursor:pointer;text-transform:uppercase;transition:background .2s,color .2s;font-family:'Barlow Condensed',sans-serif}
.tbtn.active{background:rgba(62,207,110,.15);color:#3ecf6e;border:1px solid rgba(62,207,110,.25)}
.fav-big{font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;line-height:1.1}
.fav-big.g{color:#3ecf6e}
.fav-big.w{color:#fff}
.season-note{font-size:10px;color:rgba(255,255,255,.18);letter-spacing:.08em;line-height:1.7;text-align:center}
.season-note span{color:rgba(62,207,110,.35)}

/* CONTENT */
.content{flex:1;display:flex;min-height:0}
.col{display:flex;flex-direction:column;padding:26px 30px;border-right:1px solid rgba(255,255,255,.05);overflow:hidden}
.col:last-child{border-right:none}
.col-title{font-size:9px;font-weight:700;letter-spacing:.22em;color:rgba(62,207,110,.5);text-transform:uppercase;padding-bottom:10px;border-bottom:1px solid rgba(62,207,110,.12);margin-bottom:18px;flex-shrink:0}

/* COMBAT COL */
.col-combat{width:420px;flex-shrink:0}
.hero-stats{display:flex;gap:0;margin-bottom:18px;flex-shrink:0}
.hero-stat{flex:1;display:flex;flex-direction:column;gap:5px}
.hero-stat+.hero-stat{border-left:1px solid rgba(255,255,255,.07);padding-left:22px}
.hero-stat:first-child{padding-right:22px}
.hsl{font-size:9px;font-weight:700;letter-spacing:.16em;color:rgba(255,255,255,.28);text-transform:uppercase}
.hsv{font-family:'Share Tech Mono',monospace;font-size:86px;line-height:1;letter-spacing:-.03em}
.hsv.g{color:#3ecf6e}
.hsv.w{color:#fff}
.minor-grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(4,1fr);gap:7px;flex:1;min-height:0}
.mb{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.055);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;justify-content:center;min-height:0}
.mbl{font-size:9px;font-weight:700;letter-spacing:.13em;color:rgba(255,255,255,.25);text-transform:uppercase}
.mbv{font-family:'Share Tech Mono',monospace;font-size:36px;color:#fff;line-height:1;letter-spacing:-.01em}
.mbv.g{color:#3ecf6e}

/* MIDDLE COL — ACCURACY + OBJETIVO */
.col-mid{width:440px;flex-shrink:0}
.sec-title{font-size:9px;font-weight:700;letter-spacing:.22em;color:rgba(62,207,110,.5);text-transform:uppercase;padding-bottom:10px;border-bottom:1px solid rgba(62,207,110,.12);margin-bottom:16px;flex-shrink:0}
.dual-big{display:flex;gap:0;margin-bottom:14px;flex-shrink:0}
.db-stat{flex:1;display:flex;flex-direction:column;gap:4px}
.db-stat+.db-stat{border-left:1px solid rgba(255,255,255,.07);padding-left:18px}
.db-stat:first-child{padding-right:18px}
.dbl{font-size:9px;font-weight:700;letter-spacing:.14em;color:rgba(255,255,255,.28);text-transform:uppercase}
.dbv{font-family:'Share Tech Mono',monospace;font-size:52px;line-height:1;letter-spacing:-.02em}
.dbv.g{color:#3ecf6e}
.dbv.w{color:#fff}
.bar-wrap{margin-bottom:12px;flex-shrink:0}
.bar-lbl{display:flex;justify-content:space-between;margin-bottom:5px}
.bar-lbl span{font-family:'Share Tech Mono',monospace;font-size:10px;color:rgba(255,255,255,.3);letter-spacing:.04em}
.bar-lbl strong{color:#fff}
.bar-bg{width:100%;height:4px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,#3ecf6e,#29a050);border-radius:2px}
.quad-grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(2,1fr);gap:7px;margin-bottom:0;flex-shrink:0;min-height:112px}
.mid-sep{height:1px;background:rgba(62,207,110,.1);margin:18px 0;flex-shrink:0}
.oct-grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(4,1fr);gap:7px;flex:1;min-height:0}

/* WEAPONS COL */
.col-weapons{flex:1}
.weapon-rows{display:flex;flex-direction:column;flex:1;gap:0}
.wrow{display:flex;align-items:center;gap:16px;flex:1;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.wrow:last-child{border-bottom:none}
.wrank{font-family:'Share Tech Mono',monospace;font-size:11px;color:rgba(255,255,255,.18);width:18px;flex-shrink:0;text-align:right}
.wimg{height:52px;width:110px;object-fit:contain;flex-shrink:0;filter:brightness(.88)}
.wimg-err{height:52px;width:110px;flex-shrink:0;background:rgba(255,255,255,.03);border-radius:5px}
.winfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.wtype{font-size:8px;font-weight:700;letter-spacing:.14em;color:rgba(62,207,110,.4);text-transform:uppercase}
.wname{font-size:16px;font-weight:800;color:#fff;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wbar-row{display:flex;align-items:center;gap:10px}
.wbar-bg{flex:1;height:4px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden}
.wbar-fill{height:100%;background:#3ecf6e;border-radius:2px}
.wmeta{display:flex;gap:16px;align-items:center;flex-shrink:0}
.wkills{font-family:'Share Tech Mono',monospace;font-size:17px;color:#fff;white-space:nowrap;min-width:52px}
.whs{font-family:'Share Tech Mono',monospace;font-size:12px;color:rgba(62,207,110,.75)}
.wacc{font-family:'Share Tech Mono',monospace;font-size:12px;color:rgba(255,255,255,.3)}
.wkpm{font-family:'Share Tech Mono',monospace;font-size:12px;color:rgba(255,255,255,.2)}

/* SESSION BAR */
.sess{height:100px;background:rgba(62,207,110,.035);border-top:1px solid rgba(62,207,110,.13);display:flex;align-items:center;padding:0 40px;gap:0;flex-shrink:0}
.sess-label{font-size:9px;font-weight:800;letter-spacing:.22em;color:rgba(62,207,110,.5);text-transform:uppercase;flex-shrink:0;margin-right:28px}
.sess-div{width:1px;height:52px;background:rgba(255,255,255,.07);flex-shrink:0;margin:0 28px}
.ss{display:flex;flex-direction:column;gap:4px;flex:1}
.ssl{font-size:8px;font-weight:700;letter-spacing:.14em;color:rgba(255,255,255,.25);text-transform:uppercase}
.ssv{font-family:'Share Tech Mono',monospace;font-size:30px;color:#fff;letter-spacing:-.01em;line-height:1}
.ssv.g{color:#3ecf6e}
.sess-from{font-family:'Share Tech Mono',monospace;font-size:11px;color:rgba(255,255,255,.18);letter-spacing:.06em;flex-shrink:0;margin-left:28px}
.sess-novbl{font-size:11px;color:rgba(255,255,255,.2);letter-spacing:.08em}

/* LOADING / ERROR */
.loading{display:flex;align-items:center;justify-content:center;gap:8px;flex:1}
.ld{width:7px;height:7px;border-radius:50%;background:#3ecf6e;animation:pulse 1.2s ease-in-out infinite}
.ld:nth-child(2){animation-delay:.2s}
.ld:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,80%,100%{opacity:.15;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
.err-full{display:flex;align-items:center;justify-content:center;flex:1;flex-direction:column;gap:10px;text-align:center}
.err-full .e1{font-size:15px;color:rgba(255,80,80,.7);letter-spacing:.1em}
.err-full .e2{font-size:10px;color:rgba(255,255,255,.28);letter-spacing:.08em}
</style>
</head>
<body>
<div class="topline"></div>
<div class="hdr">
  <span class="game-tag">BF6</span>
  <span class="hdr-name" id="hname">—</span>
  <div class="toggle-wrap">
    <button class="tbtn active" id="tbLife" onclick="switchMode('lifetime')">Lifetime</button>
    <button class="tbtn" id="tbSeason" onclick="switchMode('season')">Temporada</button>
  </div>
  <div class="hdr-right">
    <span class="plat-badge" id="hplat">—</span>
    <span class="hdr-meta" id="htime">—</span>
    <div class="hdr-sep"></div>
    <span class="hdr-ts" id="hts">cargando…</span>
  </div>
</div>
<div class="content" id="content">
  <div class="loading"><div class="ld"></div><div class="ld"></div><div class="ld"></div></div>
</div>
<div class="sess" id="sess"></div>
<script>
const p=new URLSearchParams(location.search);
const PLAYER=p.get('name')||'katat0nia';
const PLATFORM=p.get('platform')||'ea';
const PLAT_LABEL={ea:'EA',steam:'STEAM',psn:'PSN',xbox:'XBOX',ps5:'PS5',epic:'EPIC'}[PLATFORM]||PLATFORM.toUpperCase();
const BASE_API=window.BF6_CONFIG?.api||'https://corillo.live/api/bf6/stats';
const API=`${BASE_API}?name=${encodeURIComponent(PLAYER)}&platform=${encodeURIComponent(PLATFORM)}`;
const EA_API=`${BASE_API.replace('/bf6/stats','/bf6/eastats')}?name=${encodeURIComponent(PLAYER)}`;
const INTERVAL=60000;
const STORAGE_KEY=`bf6_session_${PLAYER}_${PLATFORM}`;
if(p.get('reset')==='1'){try{localStorage.removeItem(STORAGE_KEY)}catch{}}

let lastGoodData=null,eaData=null,lastUpdatedAt=null,tsTimer=null,isStale=false,currentMode='lifetime';

function fmt(n,d=0){if(n==null||isNaN(+n))return'—';return(+n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d})}
function fmtWin(v){if(v==null)return'—';if(typeof v==='string')return v.includes('%')?v:v+'%';return(+v).toFixed(1)+'%'}
function fmtTime(v){if(!v)return'0h';if(typeof v==='string'){const dm=v.match(/(\d+)\s*days?,\s*(\d+):(\d+)/);if(dm){const t=parseInt(dm[1])*24+parseInt(dm[2]);return t>=100?`${t}h`:`${t}h ${dm[3]}m`}if(v.includes(':')){const pts=v.split(':').map(Number);const h=pts[0],m=pts[1]||0;return h>=100?`${h}h`:h>0?`${h}h ${m}m`:`${m}m`}}const s=Number(v);if(isNaN(s))return String(v);const h=Math.floor(s/3600),m=Math.floor((s%3600)/60);return h>=100?`${h}h`:h>0?`${h}h ${m}m`:`${m}m`}
function fmtObjTime(s){if(!s)return'0m';const m=Math.floor(+s/60);return m>=60?Math.floor(m/60)+'h '+(m%60)+'m':m+'m'}
function pct(v){if(v==null)return'—';if(typeof v==='string')return v.includes('%')?v:v+'%';return(+v).toFixed(2)+'%'}
function relTime(){if(!lastUpdatedAt)return'↻ ahora';const m=Math.floor((Date.now()-lastUpdatedAt)/60000);return m<1?'↻ ahora':m===1?'↻ 1 min':`↻ ${m} min`}
function tickTs(){const el=document.getElementById('hts');if(el&&!isStale)el.textContent=relTime()}

function getBaseline(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||null}catch{return null}}
function saveBaseline(d){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({kills:Number(d.kills)||0,deaths:Number(d.deaths)||0,matches:Number(d.matchesPlayed)||0,wins:Number(d.wins)||0,seconds:Number(d.secondsPlayed)||0,startedAt:Date.now()}))}catch{}}

function renderWeapons(weapons){
  const top=(weapons||[]).filter(w=>w.kills>0).sort((a,b)=>b.kills-a.kills).slice(0,5);
  const maxK=top[0]?.kills||1;
  if(!top.length)return'<div style="color:rgba(255,255,255,.18);font-size:13px;margin-top:20px">Sin datos de armas</div>';
  return top.map((w,i)=>{
    const bar=Math.round((w.kills/maxK)*100);
    const src=w.altImage||w.image||'';
    const img=src
      ?`<img class="wimg" src="${src}" alt="${w.name}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'wimg-err'}))">`
      :`<div class="wimg-err"></div>`;
    return `<div class="wrow">
      <span class="wrank">${i+1}</span>
      ${img}
      <div class="winfo">
        <div style="display:flex;align-items:baseline;gap:8px">
          <span class="wname">${w.weaponName||w.name}</span>
          <span class="wtype">${w.type||''}</span>
        </div>
        <div class="wbar-row">
          <div class="wbar-bg"><div class="wbar-fill" style="width:${bar}%"></div></div>
          <div class="wmeta">
            <span class="wkills">${fmt(w.kills)} kills</span>
            <span class="whs">${w.headshots||'—'} HS</span>
            <span class="wacc">${w.accuracy||'—'} acc</span>
            <span class="wkpm">${w.killsPerMinute!=null?w.killsPerMinute+' kpm':'—'}</span>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
}

function renderDashboard(d){
  const dk=d.dividedKills||{};
  const obj=d.objective||{};
  const objT=obj.time||{};
  const hitRate=d.shotsFired>0?Math.min(100,(d.shotsHit/d.shotsFired)*100):0;

  document.getElementById('hname').textContent=(d.userName||PLAYER).toUpperCase();
  document.getElementById('hplat').textContent=PLAT_LABEL;
  document.getElementById('htime').textContent=fmtTime(d.timePlayed||d.secondsPlayed);

  document.getElementById('content').innerHTML=`
    <div class="col col-combat">
      <div class="col-title">COMBATE</div>
      <div class="hero-stats">
        <div class="hero-stat">
          <span class="hsl">K/D Ratio</span>
          <span class="hsv g">${fmt(d.killDeath,2)}</span>
        </div>
        <div class="hero-stat">
          <span class="hsl">Total Kills</span>
          <span class="hsv w">${fmt(d.kills)}</span>
        </div>
      </div>
      <div class="minor-grid">
        <div class="mb"><span class="mbl">KPM</span><span class="mbv">${fmt(d.killsPerMinute,2)}</span></div>
        <div class="mb"><span class="mbl">DPM</span><span class="mbv">${fmt(d.damagePerMinute,0)}</span></div>
        <div class="mb"><span class="mbl">Win Rate</span><span class="mbv g">${fmtWin(d.winPercent)}</span></div>
        <div class="mb"><span class="mbl">Partidas</span><span class="mbv">${fmt(d.matchesPlayed)}</span></div>
        <div class="mb"><span class="mbl">Muertes</span><span class="mbv">${fmt(d.deaths)}</span></div>
        <div class="mb"><span class="mbl">Victorias</span><span class="mbv g">${fmt(d.wins)}</span></div>
        <div class="mb"><span class="mbl">Kills/Partida</span><span class="mbv">${fmt(d.killsPerMatch,1)}</span></div>
        <div class="mb"><span class="mbl">Tiempo</span><span class="mbv">${fmtTime(d.timePlayed)}</span></div>
      </div>
    </div>

    <div class="col col-mid">
      <div class="sec-title">ACCURACY</div>
      <div class="dual-big">
        <div class="db-stat"><span class="dbl">Accuracy</span><span class="dbv w">${pct(d.accuracy)}</span></div>
        <div class="db-stat"><span class="dbl">Headshots</span><span class="dbv g">${pct(d.headshots)}</span></div>
      </div>
      <div class="bar-wrap">
        <div class="bar-lbl">
          <span><strong>${fmt(d.shotsHit)}</strong> impactos</span>
          <span>${fmt(d.shotsFired)} disparos</span>
        </div>
        <div class="bar-bg"><div class="bar-fill" style="width:${hitRate.toFixed(1)}%"></div></div>
      </div>
      <div class="quad-grid">
        <div class="mb"><span class="mbl">ADS Kills</span><span class="mbv">${fmt(dk.ads)}</span></div>
        <div class="mb"><span class="mbl">Hipfire</span><span class="mbv">${fmt(dk.hipfire)}</span></div>
        <div class="mb"><span class="mbl">Larga Dist.</span><span class="mbv">${fmt(dk.longDistance)}</span></div>
        <div class="mb"><span class="mbl">Multi-kill</span><span class="mbv g">${fmt(dk.multiKills)}</span></div>
      </div>
      <div class="mid-sep"></div>
      <div class="sec-title">OBJETIVO</div>
      <div class="dual-big">
        <div class="db-stat"><span class="dbl">Capturados</span><span class="dbv g">${fmt(obj.captured)}</span></div>
        <div class="db-stat"><span class="dbl">Tiempo Obj.</span><span class="dbv w">${fmtObjTime(objT.total)}</span></div>
      </div>
      <div class="oct-grid">
        <div class="mb"><span class="mbl">Revives</span><span class="mbv g">${fmt(d.revives)}</span></div>
        <div class="mb"><span class="mbl">Heals</span><span class="mbv">${fmt(d.heals)}</span></div>
        <div class="mb"><span class="mbl">Resupplies</span><span class="mbv">${fmt(d.resupplies)}</span></div>
        <div class="mb"><span class="mbl">Repairs</span><span class="mbv">${fmt(d.repairs)}</span></div>
        <div class="mb"><span class="mbl">Assists</span><span class="mbv">${fmt(d.killAssists)}</span></div>
        <div class="mb"><span class="mbl">Spotted</span><span class="mbv">${fmt(d.enemiesSpotted)}</span></div>
        <div class="mb"><span class="mbl">Savior Kills</span><span class="mbv g">${fmt(d.saviorKills)}</span></div>
        <div class="mb"><span class="mbl">Gadgets</span><span class="mbv">${fmt(d.gadgetsDestoyed)}</span></div>
      </div>
    </div>

    <div class="col col-weapons">
      <div class="col-title">TOP ARMAS</div>
      <div class="weapon-rows">${renderWeapons(d.weapons)}</div>
    </div>`;
}

function renderSession(d){
  const bl=getBaseline();
  const sb=document.getElementById('sess');
  if(!bl){
    sb.innerHTML=`<span class="sess-label">SESIÓN</span><span class="sess-from sess-novbl">Abre el overlay de sesión para iniciar</span>`;
    return;
  }
  const kills=Math.max(0,(Number(d.kills)||0)-bl.kills);
  const deaths=Math.max(0,(Number(d.deaths)||0)-bl.deaths);
  const matches=Math.max(0,(Number(d.matchesPlayed)||0)-bl.matches);
  const wins=Math.max(0,(Number(d.wins)||0)-bl.wins);
  const kd=deaths>0?fmt(kills/deaths,2):kills>0?'∞':'—';
  const secs=Math.max(0,(Number(d.secondsPlayed)||0)-bl.seconds);
  const startHH=new Date(bl.startedAt).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false});
  sb.innerHTML=`
    <span class="sess-label">SESIÓN</span>
    <div class="sess-div"></div>
    <div class="ss"><span class="ssl">Kills</span><span class="ssv g">+${fmt(kills)}</span></div>
    <div class="sess-div"></div>
    <div class="ss"><span class="ssl">K/D Sesión</span><span class="ssv">${kd}</span></div>
    <div class="sess-div"></div>
    <div class="ss"><span class="ssl">Muertes</span><span class="ssv">${fmt(deaths)}</span></div>
    <div class="sess-div"></div>
    <div class="ss"><span class="ssl">Partidas</span><span class="ssv">${fmt(matches)}</span></div>
    <div class="sess-div"></div>
    <div class="ss"><span class="ssl">Victorias</span><span class="ssv g">${fmt(wins)}</span></div>
    <div class="sess-div"></div>
    <div class="ss"><span class="ssl">Tiempo</span><span class="ssv">${fmtTime(secs)}</span></div>
    <span class="sess-from">desde ${startHH}</span>`;
}

function renderSeasonContent(d){
  const s=d.season;
  document.getElementById('htime').textContent=s.hoursPlayed?s.hoursPlayed+'h jugadas':'—';
  document.getElementById('content').innerHTML=`
    <div class="col col-combat">
      <div class="col-title">COMBATE · TEMPORADA</div>
      <div class="hero-stats">

}

function switchMode(mode){
  currentMode=mode;
  document.getElementById('tbLife').classList.toggle('active',mode==='lifetime');
  document.getElementById('tbSeason').classList.toggle('active',mode==='season');
  if(mode==='lifetime'){
    if(lastGoodData){renderDashboard(lastGoodData);renderSession(lastGoodData)}
  }else{
    if(eaData){renderSeasonContent(eaData)}
    else{
      document.getElementById('content').innerHTML='<div class="loading"><div class="ld"></div><div class="ld"></div><div class="ld"></div></div>';
      fetchEAStats();
    }
  }
}

async function fetchEAStats(){
  try{
    const res=await fetch(EA_API);
    const data=await res.json();
    if(!res.ok||data.error){
      if(currentMode==='season'&&!eaData)
        document.getElementById('content').innerHTML='<div class="err-full"><span class="e1">Stats de temporada no disponibles</span><span class="e2">Reintentando en 60 seg</span></div>';
      return;
    }
    eaData=data;
    if(currentMode==='season')renderSeasonContent(data);
  }catch(e){console.warn('EA stats:',e.message)}
}

function getErrType(status,data){
  const msg=(data?.errors?.[0]?.message||data?.message||'').toLowerCase();
  if(status===404||msg.includes('not found'))return'not_found';
  if(status===504||status===502)return'timeout';
  return'generic';
}
function renderError(type){
  const line1=type==='not_found'?`Jugador "${PLAYER}" no encontrado`:type==='timeout'?'API sin respuesta':'Stats no disponibles';
  const sub=type==='not_found'?'Verifica nombre y plataforma en la URL':'Reintentando en 60 seg';
  document.getElementById('content').innerHTML=`<div class="err-full"><span class="e1">${line1}</span><span class="e2">${sub}</span></div>`;
}
function markStale(){
  isStale=true;
  const el=document.getElementById('hts');
  if(el){el.textContent='⚠ sin actualizar';el.style.color='rgba(255,180,0,.6)'}
}
function unmarkStale(){
  isStale=false;
  const el=document.getElementById('hts');
  if(el){el.style.color='';el.textContent=relTime()}
}
async function fetchStats(isRefresh=false){
  try{
    const res=await fetch(API);
    const data=await res.json();
    if(!res.ok||data.error){
      if(isRefresh&&lastGoodData){markStale();return}
      renderError(getErrType(res.status,data));return;
    }
    lastGoodData=data;lastUpdatedAt=Date.now();
    if(!tsTimer)tsTimer=setInterval(tickTs,30000);
    if(isRefresh)unmarkStale();
    else{const el=document.getElementById('hts');if(el){el.style.color='';el.textContent=relTime()}}
    if(!getBaseline())saveBaseline(data);
    if(currentMode==='lifetime'){renderDashboard(data);renderSession(data);}
    fetchEAStats();
  }catch(e){
    if(isRefresh&&lastGoodData){markStale();return}
    renderError('timeout');
    console.warn('BF6 dashboard:',e.message);
  }
}
fetchStats();
setInterval(()=>{fetchStats(true);fetchEAStats();},INTERVAL);
</script>
