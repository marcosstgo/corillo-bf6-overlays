<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BF6 Squad Overlay</title>
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:transparent;font-family:'Barlow Condensed',sans-serif;-webkit-font-smoothing:antialiased;display:inline-flex;gap:8px;align-items:flex-start}
.pcard{width:270px;background:rgba(0,0,0,.82);border-radius:12px;border-left:3px solid #3ecf6e;overflow:hidden;backdrop-filter:blur(6px);box-shadow:0 4px 32px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.04);position:relative;flex-shrink:0}
.pcard::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.08) 2px,rgba(0,0,0,.08) 4px);pointer-events:none;border-radius:12px;z-index:1}
.pcard-inner{position:relative;z-index:2;padding:12px 14px 10px}
.ph{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.pname{font-size:15px;font-weight:800;color:#fff;letter-spacing:.04em;text-transform:uppercase;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbadge{background:rgba(62,207,110,.15);border:1px solid rgba(62,207,110,.4);color:#3ecf6e;font-size:9px;font-weight:700;letter-spacing:.08em;padding:2px 7px;border-radius:20px;text-transform:uppercase;flex-shrink:0}
.pdivider{height:1px;background:linear-gradient(90deg,#3ecf6e 0%,rgba(62,207,110,.15) 60%,transparent 100%);margin-bottom:8px}
.pcenter{display:flex;gap:0;margin-bottom:10px}
.pstat{flex:1;display:flex;flex-direction:column;gap:2px}
.pstat+.pstat{border-left:1px solid rgba(255,255,255,.07);padding-left:14px}
.pstat:first-child{padding-right:14px}
.psl{font-size:9px;font-weight:700;letter-spacing:.14em;color:rgba(255,255,255,.35);text-transform:uppercase}
.psv{font-family:'Share Tech Mono',monospace;font-size:40px;line-height:1;letter-spacing:-.02em}
.psv.kd{color:#3ecf6e}
.psv.kills{color:#fff}
.pbot{display:flex;justify-content:space-between;background:rgba(255,255,255,.03);border-radius:6px;padding:6px 10px;margin-bottom:8px;border:1px solid rgba(255,255,255,.05)}
.pm{display:flex;flex-direction:column;align-items:center;gap:2px}
.pml{font-size:8px;font-weight:700;letter-spacing:.1em;color:rgba(255,255,255,.3);text-transform:uppercase}
.pmv{font-family:'Share Tech Mono',monospace;font-size:13px;color:#fff}
.pfooter{display:flex;justify-content:space-between;align-items:center}
.pfbrand{font-size:8px;font-weight:700;letter-spacing:.12em;color:rgba(62,207,110,.4);text-transform:uppercase}
.pftime{font-family:'Share Tech Mono',monospace;font-size:8px;color:rgba(255,255,255,.2)}
.pldg{display:flex;align-items:center;justify-content:center;gap:6px;min-height:110px}
.ld{width:5px;height:5px;border-radius:50%;background:#3ecf6e;animation:pulse 1.2s ease-in-out infinite}
.ld:nth-child(2){animation-delay:.2s}
.ld:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,80%,100%{opacity:.15;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
.perr{font-size:10px;color:rgba(255,80,80,.7);text-align:center;min-height:110px;display:flex;align-items:center;justify-content:center;line-height:1.6}
.perr .err-sub{font-size:9px;opacity:.5;letter-spacing:.06em;display:block;margin-top:3px}
@keyframes flash{0%{border-left-color:#3ecf6e}50%{border-left-color:rgba(62,207,110,.2)}100%{border-left-color:#3ecf6e}}
.pcard.refreshing{animation:flash .5s ease}
</style>
</head>
<body>
<script>
const q=new URLSearchParams(location.search);
const NAMES=(q.get('names')||'katat0nia').split(',').map(s=>s.trim()).filter(Boolean).slice(0,4);
const PLATS=(q.get('platforms')||'ea').split(',').map(s=>s.trim()||'ea');
const PLAT_LABEL={ea:'EA',steam:'STEAM',psn:'PSN',xbox:'XBOX',ps5:'PS5',epic:'EPIC'};
const INTERVAL=60000;
const BASE_API=window.BF6_CONFIG?.api||'https://corillo.live/api/bf6/stats';

function fmt(n,d=0){if(n==null||isNaN(+n))return'—';return(+n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d})}
function fmtWin(v){if(v==null)return'—';if(typeof v==='string')return v.includes('%')?v:v+'%';return(+v).toFixed(1)+'%'}
function nowTime(){return new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false})}
function getErrType(status,data){
  const msg=(data?.errors?.[0]?.message||data?.message||'').toLowerCase();
  if(status===404||msg.includes('not found'))return'not_found';
  if(status===504||status===502)return'timeout';
  return'generic';
}

NAMES.forEach((name,i)=>{
  const plat=PLATS[i]||PLATS[0]||'ea';
  const API=`${BASE_API}?name=${encodeURIComponent(name)}&platform=${encodeURIComponent(plat)}`;
  let lastGood=null;

  const card=document.createElement('div');
  card.className='pcard';card.id=`pc${i}`;
  card.innerHTML=`<div class="pcard-inner" id="pi${i}"><div class="pldg"><div class="ld"></div><div class="ld"></div><div class="ld"></div></div></div>`;
  document.body.appendChild(card);

  function renderStats(d){
    document.getElementById(`pi${i}`).innerHTML=`
      <div class="ph">
        <span class="pname">${d.userName||name}</span>
        <span class="pbadge">${PLAT_LABEL[plat]||plat.toUpperCase()}</span>
      </div>
      <div class="pdivider"></div>
      <div class="pcenter">
        <div class="pstat"><span class="psl">K/D</span><span class="psv kd">${fmt(d.killDeath,2)}</span></div>
        <div class="pstat"><span class="psl">Kills</span><span class="psv kills">${fmt(d.kills)}</span></div>
      </div>
      <div class="pbot">
        <div class="pm"><span class="pml">KPM</span><span class="pmv">${fmt(d.killsPerMinute,2)}</span></div>
        <div class="pm"><span class="pml">Win%</span><span class="pmv">${fmtWin(d.winPercent)}</span></div>
        <div class="pm"><span class="pml">DPM</span><span class="pmv">${fmt(d.damagePerMinute,0)}</span></div>
        <div class="pm"><span class="pml">Matches</span><span class="pmv">${fmt(d.matchesPlayed)}</span></div>
      </div>
      <div class="pfooter">
        <span class="pfbrand">CORILLO · BF6</span>
        <span class="pftime" id="pft${i}">Updated ${nowTime()}</span>
      </div>`;
  }

  function renderError(type){
    const icon=type==='not_found'?'⚠':'↻';
    const line1=type==='not_found'?`"${name}" no encontrado`:type==='timeout'?'API sin respuesta':'Stats no disponibles';
    const sub=type==='not_found'?'Verifica nombre y plataforma':'Reintentando en 60 seg';
    document.getElementById(`pi${i}`).innerHTML=`<div class="perr"><div><div style="font-size:18px;margin-bottom:5px;opacity:.4">${icon}</div><div>${line1}</div><span class="err-sub">${sub}</span></div></div>`;
  }

  function markStale(){const ft=document.getElementById(`pft${i}`);if(!ft)return;ft.textContent='⚠ sin actualizar';ft.style.color='rgba(255,180,0,.65)'}
  function unmarkStale(){const ft=document.getElementById(`pft${i}`);if(!ft)return;ft.style.color=''}

  async function fetchPlayer(isRefresh=false){
    const c=document.getElementById(`pc${i}`);
    if(isRefresh&&lastGood){c.classList.add('refreshing');setTimeout(()=>c.classList.remove('refreshing'),500)}
    try{
      const res=await fetch(API);
      const data=await res.json();
      if(!res.ok||data.error){
        if(isRefresh&&lastGood){markStale();return}
        renderError(getErrType(res.status,data));return;
      }
      lastGood=data;
      if(isRefresh)unmarkStale();
      renderStats(data);
    }catch(e){
      if(isRefresh&&lastGood){markStale();return}
      renderError('timeout');
    }
  }

  fetchPlayer();
  setInterval(()=>fetchPlayer(true),INTERVAL);
});
</script>
</body>
</html>
